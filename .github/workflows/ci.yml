name: CI - Parcial 2 FIS

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss

jobs:
  calidad:
    name: Compilacion, pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar, probar y verificar cobertura
        run: mvn -B -ntp clean verify

      - name: Subir reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
          retention-days: 15

      - name: Subir reportes de pruebas Surefire
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reportes-surefire
          path: target/surefire-reports/
          retention-days: 15

      - name: Resumen de calidad
        if: always()
        run: |
          echo "### Resultado de la pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Compilacion y pruebas: \`mvn clean verify\`" >> $GITHUB_STEP_SUMMARY
          if ls target/surefire-reports/*.xml >/dev/null 2>&1; then
            PRUEBAS=$(grep -h "<testsuite" target/surefire-reports/*.xml \
              | sed -E 's/.*tests="([0-9]+)".*/\1/' | awk '{s+=$1} END {print s}')
            echo "- Pruebas ejecutadas: **$PRUEBAS**" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f target/site/jacoco/jacoco.csv ]; then
            read -r MISSED COVERED < <(awk -F, 'NR>1 {m+=$4; c+=$5} END {print m, c}' target/site/jacoco/jacoco.csv)
            PCT=$(awk -v m="$MISSED" -v c="$COVERED" 'BEGIN {printf "%.2f", 100*c/(m+c)}')
            echo "- Cobertura de instrucciones: **$PCT %**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Quality gate: cobertura de instrucciones >= 70% (JaCoCo)" >> $GITHUB_STEP_SUMMARY
          echo "- Artefactos: reporte JaCoCo y reportes Surefire" >> $GITHUB_STEP_SUMMARY
